  <path d="M190 214c8 3 17 3 25 0" fill="none" stroke="#f3e8d9" stroke-width="2" stroke-linecap="round" opacity=".85"/>
  <ellipse cx="180" cy="191" rx="24" ry="18" fill="url(#cheek)" opacity=".65"/>
  <ellipse cx="237" cy="191" rx="24" ry="18" fill="url(#cheek)" opacity=".5"/>

