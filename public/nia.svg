<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-labelledby="nia-title nia-desc">
  <title id="nia-title">Nia, the DYNA research guide</title>
  <desc id="nia-desc">An original editorial vector illustration of a young woman with shoulder-length dark hair and warm brown skin, wearing an ivory research jacket over navy clothing and holding a scientific tablet.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98b65"/>
      <stop offset=".48" stop-color="#b97855"/>
      <stop offset="1" stop-color="#8b4f39"/>
    </linearGradient>
    <linearGradient id="skinLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d49b73"/>
      <stop offset="1" stop-color="#a96545"/>
    </linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a96545"/>
      <stop offset="1" stop-color="#75402f"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset=".5" stop-color="#242733"/>
      <stop offset="1" stop-color="#3b3d49"/>
    </linearGradient>
    <linearGradient id="hairLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3d49"/>
      <stop offset="1" stop-color="#171b26"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e5"/>
      <stop offset=".52" stop-color="#e8ddca"/>
      <stop offset="1" stop-color="#cbbba3"/>
    </linearGradient>
    <linearGradient id="jacketShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6c7b1"/>
      <stop offset="1" stop-color="#ac9a80"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24304a"/>
      <stop offset="1" stop-color="#11182b"/>
    </linearGradient>
    <linearGradient id="tablet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b364f"/>
      <stop offset="1" stop-color="#11182b"/>
    </linearGradient>
    <radialGradient id="cheek" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#dca17b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a96545" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <ellipse cx="215" cy="532" rx="102" ry="13" fill="#18213d" opacity=".08" filter="url(#softShadow)"/>

  <!-- back hair -->
  <path d="M140 98C151 54 181 34 219 38c42 4 66 30 70 69 5 51-4 112-21 147-8 16-19 24-29 30l-13-45c11-38 14-76 4-105-9-28-28-42-49-40-33 3-46 38-43 81 2 32-4 62-17 82-16-19-24-49-20-82 3-28 24-61 39-82Z" fill="url(#hair)"/>

