  <path d="M239 347h15v3h-15zM239 353h15v3h-15z" fill="#f6eddd" opacity=".65"/>
  <circle cx="207" cy="385" r="3" fill="#9b8a72"/>
  <circle cx="207" cy="412" r="3" fill="#9b8a72"/>
  <circle cx="207" cy="439" r="3" fill="#9b8a72"/>

  <!-- left sleeve and hand holding tablet -->
  <path d="M145 284c-17 2-28 12-37 29l-37 66c-6 12-3 25 8 31 12 7 25 2 33-9l44-69c7-20 7-36-11-48Z" fill="url(#jacket)"/>
  <path d="M112 309c-6 12-17 29-26 46" fill="none" stroke="#ad9b81" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <path d="M80 388c-7 10-3 24 9 28l16 4 14-17-9-21-30 6Z" fill="url(#skin)"/>
  <path d="M89 391c4 6 10 9 17 8" fill="none" stroke="#7c4432" stroke-width="3" stroke-linecap="round"/>
