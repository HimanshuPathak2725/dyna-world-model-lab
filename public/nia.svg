  <path d="M144 130c4-37 26-67 61-72 27-4 51 11 57 36-17-17-40-23-57-16-20 8-29 30-33 52-3 17-11 29-20 34-5-10-9-22-8-34Z" fill="url(#hairLight)"/>
  <path d="M150 111c8-24 28-43 49-45m-34 70c7-17 20-30 36-36m-43 75c6-13 14-23 25-29m58-34c13 15 17 36 13 58m-96 31c-3 14-9 26-17 34" fill="none" stroke="#4a4b58" stroke-width="4" stroke-linecap="round" opacity=".45"/>
  <path d="M151 111c8-24 28-43 49-45m-34 70c7-17 20-30 36-36" fill="none" stroke="#161a26" stroke-width="3" stroke-linecap="round" opacity=".65"/>

